services:
  - type: web
    name: wander
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ROOM_PASSCODE
        sync: false
      - key: ABOUT_PAUL
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "300"
