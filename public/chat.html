<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wander — group chat</title>
<style>
  :root{--bg:#f6f3ee;--card:#fffdf8;--ink:#23252b;--muted:#6b6f78;--line:#e6e1d8;--paul:#2f6fdf;--claude:#d9774f;--gpt:#10a37f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  header h1{font-size:17px;margin:0}
  header .who{font-size:12.5px;color:var(--muted)}
  header a{margin-left:auto;font-size:13px;color:var(--paul);text-decoration:none;font-weight:600}
  .faces{display:flex}
  .face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border:2px solid var(--card);margin-left:-6px}
  .face:first-child{margin-left:0}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{display:flex;gap:9px;max-width:88%}
  .m .face{flex:none;margin:0;border:0}
  .m .b{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .m .n{font-size:12px;font-weight:700;margin-bottom:2px}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m.me .b{background:var(--paul);color:#fff;border-color:var(--paul);border-radius:14px 14px 4px 14px}
  .m.me .n{display:none}
  .day{align-self:center;font-size:12px;color:var(--muted);margin:6px 0}
  #typing{min-height:22px;padding:0 18px;font-size:13px;color:var(--muted)}
  form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--card)}
  #inp{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;max-height:140px;outline:none;background:#fff}
  #inp:focus{border-color:var(--paul)}
  button{border:0;border-radius:20px;background:var(--paul);color:#fff;font-weight:700;padding:0 18px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  #gate .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:340px;width:100%;text-align:center}
  #gate h2{margin:0 0 6px}
  #gate p{color:var(--muted);font-size:14px;margin:0 0 16px}
  #gate input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:10px}
  #gate button{width:100%;padding:12px}
  #gateErr{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="faces"><div class="face" style="background:var(--paul)">P</div><div class="face" style="background:var(--claude)">C</div><div class="face" style="background:var(--gpt)">G</div></div>
    <div><h1>Paul, Claude &amp; ChatGPT</h1><div class="who" id="status">Connecting…</div></div>
    <a href="/">Play Wander →</a>
  </header>
  <div id="log"></div>
  <div id="typing"></div>
  <form id="f"><textarea id="inp" rows="1" placeholder="Message Claude and ChatGPT…"></textarea><button id="send">Send</button></form>
</div>
<div id="gate">
  <div class="card">
    <h2>💬 Group chat</h2>
    <p>A private room for you, Claude and ChatGPT.</p>
    <input id="gName" placeholder="Your name" value="Paul" maxlength="24">
    <input id="gPass" type="password" placeholder="Passcode">
    <button id="gGo">Come in</button>
    <div id="gateErr"></div>
  </div>
</div>
<script>
(function(){
  const log=document.getElementById('log'), inp=document.getElementById('inp'), statusEl=document.getElementById('status'), typingEl=document.getElementById('typing');
  const gate=document.getElementById('gate'), gName=document.getElementById('gName'), gPass=document.getElementById('gPass'), gErr=document.getElementById('gateErr');
  const colors={Claude:'var(--claude)',ChatGPT:'var(--gpt)'};
  let ws=null, me='Paul', pass='', typing=new Set(), lastDay='', retry=0;
  const store={ get(k){ try{return localStorage.getItem(k)}catch(_){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(_){} } };
  gName.value=store.get('room-name')||'Paul'; gPass.value=store.get('room-pass')||'';
  function add(m){
    const d=new Date(m.t), day=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    if(day!==lastDay){ lastDay=day; const x=document.createElement('div'); x.className='day'; x.textContent=day; log.append(x); }
    const mine=m.kind==='human'&&m.name===me;
    const row=document.createElement('div'); row.className='m'+(mine?' me':'');
    const f=document.createElement('div'); f.className='face'; f.style.background=colors[m.name]||'var(--paul)'; f.textContent=(m.name||'?')[0].toUpperCase();
    const b=document.createElement('div'); b.className='b'; b.title=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const n=document.createElement('div'); n.className='n'; n.style.color=colors[m.name]||'var(--paul)'; n.textContent=m.name;
    b.append(n, document.createTextNode(m.text)); row.append(f,b); log.append(row);
    log.scrollTop=log.scrollHeight;
  }
  function showTyping(){ const t=[...typing]; typingEl.textContent=t.length?`${t.join(' and ')} ${t.length>1?'are':'is'} typing…`:''; }
  function connect(){
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/roomws');
    ws.onopen=()=>{ retry=0; if(pass) ws.send(JSON.stringify({type:'auth',pass,name:me})); };
    ws.onmessage=e=>{
      let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
      if(m.type==='denied'){ gate.style.display='flex'; gErr.textContent=m.reason; pass=''; return; }
      if(m.type==='history'){ gate.style.display='none'; log.innerHTML=''; lastDay=''; m.msgs.forEach(add);
        statusEl.textContent=m.ais.length?`Live with ${m.ais.join(' and ')}`:'The AIs are not switched on yet'; inp.focus(); return; }
      if(m.type==='msg'){ typing.delete(m.m.name); showTyping(); add(m.m); return; }
      if(m.type==='typing'){ m.on?typing.add(m.name):typing.delete(m.name); showTyping(); }
    };
    ws.onclose=()=>{ statusEl.textContent='Reconnecting…'; setTimeout(connect,Math.min(8000,1000*(++retry))); };
  }
  function enter(){ me=gName.value.trim()||'Paul'; pass=gPass.value; store.set('room-name',me); store.set('room-pass',pass); gErr.textContent='';
    if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'auth',pass,name:me})); else if(!ws) connect(); }
  document.getElementById('gGo').onclick=enter;
  gPass.addEventListener('keydown',e=>{ if(e.key==='Enter') enter(); });
  document.getElementById('f').onsubmit=e=>{ e.preventDefault(); const t=inp.value.trim(); if(!t||!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:'say',text:t})); inp.value=''; inp.style.height=''; };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('f').requestSubmit(); } });
  inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(140,inp.scrollHeight)+'px'; });
  if(gPass.value){ pass=gPass.value; me=gName.value.trim()||'Paul'; }
  connect();
})();
</script>
</body>
</html>
